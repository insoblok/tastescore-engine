runtime: python312
service: backend
entrypoint: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app

env_variables:
  PYTHONUNBUFFERED: "1"
  APP_NAME: Wallet Tracker
  APP_VERSION: 1.0.0
  DEBUG: False
  BTC_INFO_URL: https://blockchain.info
  BTC_PRICE_URL: https://blockchain.info/ticker
# Automatic scaling configuration
automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10
  target_throughput_utilization: 0.8

# Basic scaling alternative (choose one)
#basic_scaling:
#  max_instances: 5
#  idle_timeout: 10m

# Resource allocation
resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10